# DRNO — stack produksi untuk VPS bersama yang sudah memakai Nginx di host.
# Jalankan sebagai root dari root proyek: ./deploy/vps/drno.sh up
# Nginx host meneruskan drno.site ke 127.0.0.1:3001. Jangan publikasikan
# PostgreSQL atau API ke jaringan publik.
name: drno

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.db
    image: drno-db:prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: drno
      POSTGRES_USER: drno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drno -d drno"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 384m
    networks: [backend]
    logging: *logging

  worker:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.worker
    image: drno-worker:prod
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://drno:${POSTGRES_PASSWORD}@db:5432/drno
      DRNO_STORE: postgres
      TZ: Asia/Jakarta
    volumes:
      - site:/site
      - ../../config:/app/config:ro      # config/sources.json (daftar situs untuk Scrapling)
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; h=float(os.environ.get('DRNO_INTERVAL_HOURS','6')); t=float(open('/site/private/.heartbeat').read()); sys.exit(0 if time.time()-t < h*7200+600 else 1)"]
      interval: 5m
      timeout: 10s
      start_period: 15m
    mem_limit: 768m
    networks: [backend]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: drno-web:prod
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - site:/var/www/html
    depends_on:
      worker: { condition: service_started }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/robots.txt') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 256m
    networks: [frontend]
    logging: *logging

  backup:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    entrypoint: ["bash", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: drno
      PGDATABASE: drno
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DRNO_BACKUP_KEEP_DAYS: ${DRNO_BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Jakarta
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../../backups:/backups
      - site:/site:ro
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    networks: [backend]
    logging: *logging

  # API internal (opsional, eksperimental; tidak dibuka ke internet). Aktifkan: ./deploy/vps/drno.sh up-api
  api:
    profiles: ["api"]
    build: ../../backend
    image: drno-api:prod
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://drno:${POSTGRES_PASSWORD}@db:5432/drno
      DRNO_STORE: postgres
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    networks: [backend]
    logging: *logging

networks:
  frontend:
  backend:

volumes:
  pgdata:
  site:
