# DRNO pada VPS bersama. TLS tetap dikelola Certbot di host.
server {
    listen 80;
    listen [::]:80;
    server_name drno.site;
    return 301 https://drno.site$request_uri;
}

server {
    listen 443 ssl;
    server_name drno.site;

    ssl_certificate /etc/letsencrypt/live/drno.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drno.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/drno.site.access.log;
    error_log  /var/log/nginx/drno.site.error.log;

    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Jangan meneruskan X-Forwarded-For dari klien: Apache memakai alamat
        # ini untuk audit dan pembatasan percobaan login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
}
