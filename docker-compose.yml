services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drno
      POSTGRES_USER: drno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi di .env}
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"]
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: .env
    depends_on: [db, redis]
    ports: ["127.0.0.1:8000:8000"]   # hanya lokal; akses publik lewat reverse proxy + autentikasi
  worker:
    build: ./backend
    command: celery -A drno.tasks worker -B --loglevel=info
    env_file: .env
    depends_on: [db, redis]
volumes:
  pgdata:
